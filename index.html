<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#050811" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="BOLÃO BR" />
<title>BOLÃO BR · Copa 2026 🇧🇷</title>

<!-- PWA Manifest -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" type="image/svg+xml" href="icon.svg" />

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Manrope:wght@400;500;600;700;800&family=Bungee&display=swap" rel="stylesheet" />

<!-- Tailwind -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: {
        display: ['Anton', 'Impact', 'sans-serif'],
        body: ['Manrope', 'system-ui', 'sans-serif'],
        chant: ['Bungee', 'Impact', 'sans-serif'],
      },
      colors: {
        ink:    '#050811',
        carbon: '#0c1322',
        steel:  '#161f33',
        bone:   '#e9ecf2',
        muted:  '#7a8499',
        lime:   '#caff33',
        neon:   '#00ffa3',
        gold:   '#ffd60a',
        cherry: '#ff2d87',
        cyan:   '#00e5ff',
      },
      boxShadow: {
        glow:   '0 0 24px rgba(0,255,163,.35), 0 0 60px rgba(0,255,163,.15)',
        gold:   '0 0 24px rgba(255,214,10,.45), 0 0 70px rgba(255,214,10,.18)',
        cherry: '0 0 24px rgba(255,45,135,.45), 0 0 70px rgba(255,45,135,.2)',
      },
      animation: {
        'pulse-glow': 'pulseGlow 2.2s ease-in-out infinite',
        'shake':      'shake 0.5s ease-in-out',
        'float':      'float 6s ease-in-out infinite',
        'shimmer':    'shimmer 2.5s linear infinite',
        'pop':        'pop 0.45s cubic-bezier(.34,1.56,.64,1)',
        'slide-up':   'slideUp 0.4s cubic-bezier(.22,1,.36,1)',
        'fade':       'fade 0.3s ease-out',
        'spin-slow':  'spin 8s linear infinite',
      },
      keyframes: {
        pulseGlow: { '0%,100%': { opacity: 1 }, '50%': { opacity: .55 } },
        shake: { '0%,100%': { transform: 'translateX(0)' }, '25%': { transform: 'translateX(-4px)' }, '75%': { transform: 'translateX(4px)' } },
        float: { '0%,100%': { transform: 'translateY(0px)' }, '50%': { transform: 'translateY(-10px)' } },
        shimmer: { '0%': { backgroundPosition: '-200% 0' }, '100%': { backgroundPosition: '200% 0' } },
        pop: { '0%': { transform: 'scale(0.85)', opacity: 0 }, '100%': { transform: 'scale(1)', opacity: 1 } },
        slideUp: { '0%': { transform: 'translateY(20px)', opacity: 0 }, '100%': { transform: 'translateY(0)', opacity: 1 } },
        fade: { '0%': { opacity: 0 }, '100%': { opacity: 1 } },
      },
    }
  }
}
</script>

<style>
  :root{
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { background:#050811; color:#e9ecf2; }
  body{
    font-family:'Manrope', system-ui, sans-serif;
    overscroll-behavior-y: contain;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }
  /* Bg ambience */
  .bg-stadium{
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(0,255,163,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 30%, rgba(255,214,10,.06), transparent 60%),
      radial-gradient(700px 400px at 100% 90%, rgba(255,45,135,.07), transparent 60%),
      #050811;
  }
  .grain::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:1; opacity:.05;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  /* Scrollbar hide */
  .no-scrollbar::-webkit-scrollbar { display:none; }
  .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }

  /* Neon dot */
  .live-dot{
    width:8px; height:8px; border-radius:50%; background:#ff2d87;
    box-shadow:0 0 0 0 rgba(255,45,135,.7);
    animation: pulseDot 1.5s infinite;
  }
  @keyframes pulseDot{
    0%{ box-shadow:0 0 0 0 rgba(255,45,135,.7); }
    70%{ box-shadow:0 0 0 10px rgba(255,45,135,0); }
    100%{ box-shadow:0 0 0 0 rgba(255,45,135,0); }
  }

  /* Shimmer ribbon (placeholders / golden text) */
  .shimmer-text{
    background: linear-gradient(90deg, #ffd60a 0%, #fff8c2 35%, #ffd60a 60%, #b08900 80%, #ffd60a 100%);
    background-size: 200% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    animation: shimmer 3s linear infinite;
  }

  /* Bottom nav blur */
  .nav-blur{
    background: rgba(8,11,22,.78);
    backdrop-filter: saturate(180%) blur(18px);
    -webkit-backdrop-filter: saturate(180%) blur(18px);
  }

  /* Match card hover-able */
  .card{
    background: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.07);
    border-radius: 18px;
  }
  .card-elev{
    background:
      radial-gradient(240px 80px at 20% 0%, rgba(0,255,163,.08), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border:1px solid rgba(255,255,255,0.08);
    border-radius:20px;
  }
  .chip{
    border:1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.04);
    border-radius: 999px;
  }

  /* Buttons */
  .btn-primary{
    background: linear-gradient(180deg, #00ffa3 0%, #00c982 100%);
    color:#04140c; font-weight:800;
    box-shadow: 0 8px 24px rgba(0,255,163,.25), inset 0 1px 0 rgba(255,255,255,.45);
  }
  .btn-primary:active{ transform: translateY(1px) scale(.99); }
  .btn-ghost{
    border:1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.03);
  }

  /* Modal */
  .modal-back{
    background: rgba(2,4,9,.7);
    backdrop-filter: blur(8px);
  }
  .sheet{
    background: linear-gradient(180deg, #0d1322 0%, #070b16 100%);
    border-top-left-radius: 28px;
    border-top-right-radius: 28px;
    border-top: 1px solid rgba(255,255,255,0.08);
  }

  /* Flag emoji big */
  .flag{ font-size: 36px; line-height: 1; }

  /* Toast */
  .toast{
    background: linear-gradient(180deg, #161f33, #0c1322);
    border:1px solid rgba(0,255,163,.4);
    box-shadow: 0 12px 40px rgba(0,255,163,.2);
  }

  /* Splash */
  #splash{
    position:fixed; inset:0; z-index:200;
    background: radial-gradient(800px 600px at 50% 30%, #1a2747, #050811 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: opacity .5s ease, visibility .5s ease;
  }
  #splash.hide{ opacity:0; visibility:hidden; }
  .splash-ring{
    width:120px; height:120px; border-radius:50%;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:#00ffa3; border-right-color:#ffd60a;
    animation: spin 1.2s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Confetti */
  .confetti{
    position:fixed; inset:0; pointer-events:none; z-index:150; overflow:hidden;
  }
  .confetti span{
    position:absolute; top:-10vh; width:8px; height:14px;
    animation: fall linear forwards;
    opacity:.9;
  }
  @keyframes fall{
    to{ transform: translateY(120vh) rotate(720deg); opacity:0; }
  }

  /* Story card aspect */
  .story{
    aspect-ratio: 9/16;
    border-radius: 24px;
    overflow:hidden;
    position:relative;
  }

  /* Skeleton */
  .sk{
    background: linear-gradient(90deg, rgba(255,255,255,.04) 0%, rgba(255,255,255,.09) 50%, rgba(255,255,255,.04) 100%);
    background-size: 200% 100%;
    animation: shimmer 1.6s linear infinite;
  }

  /* selection */
  ::selection{ background: #00ffa3; color:#04140c; }

  /* Range input */
  input[type=range]{
    -webkit-appearance:none; appearance:none; background:transparent;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:6px; background: rgba(255,255,255,.1); border-radius:6px;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; margin-top:-7px;
    width:20px; height:20px; border-radius:50%; background:#00ffa3;
    box-shadow:0 0 12px rgba(0,255,163,.6);
  }

  /* Tab indicator */
  .tab-active .tab-ico{
    color:#00ffa3; text-shadow:0 0 12px rgba(0,255,163,.6);
  }
  .tab-active .tab-label{ color:#00ffa3; }

  /* Notif dot */
  .notif-dot{
    position:absolute; top:-2px; right:-2px;
    width:8px; height:8px; border-radius:50%;
    background:#ff2d87; box-shadow:0 0 8px #ff2d87;
  }

  /* App container — phone frame on desktop */
  @media (min-width: 640px){
    body{ background:#020308; }
    #app-frame{
      max-width: 430px;
      margin: 24px auto;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 36px;
      overflow: hidden;
      box-shadow: 0 30px 90px rgba(0,0,0,.6), 0 0 0 8px rgba(255,255,255,.02);
      min-height: calc(100vh - 48px);
    }
  }

  /* Holographic border */
  .holo{
    position:relative;
  }
  .holo::before{
    content:""; position:absolute; inset:-1px; border-radius:inherit; padding:1px;
    background: conic-gradient(from 180deg, #00ffa3, #00e5ff, #ff2d87, #ffd60a, #00ffa3);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    animation: spin 8s linear infinite;
    opacity:.7;
    pointer-events:none;
  }

  /* Hide details from screen at idle */
  [data-screen]{ display:none; }
  [data-screen].active{ display:block; animation: fade .35s ease-out; }

  /* Trophy gleam */
  .trophy-bg{
    background:
      radial-gradient(400px 200px at 50% 0%, rgba(255,214,10,.25), transparent 70%),
      linear-gradient(180deg, #1a1a2e 0%, #0c0c1a 100%);
  }

  /* ===== GRUPOS PREMIUM ===== */
  .group-premium{
    position: relative;
    background:
      radial-gradient(280px 120px at 100% 0%, rgba(0,255,163,.08), transparent 60%),
      radial-gradient(280px 120px at 0% 100%, rgba(255,45,135,.06), transparent 60%),
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    overflow: hidden;
    transition: transform .2s, box-shadow .2s;
  }
  .group-premium:active{ transform: scale(.99); }
  .group-premium.is-active{
    border-color: rgba(0,255,163,.4);
    box-shadow: 0 0 0 1px rgba(0,255,163,.3), 0 12px 40px rgba(0,255,163,.12);
  }
  .group-premium::before{
    content:"";
    position: absolute;
    top: -1px; left: -1px; right: -1px; height: 2px;
    background: linear-gradient(90deg, transparent, #00ffa3 30%, #ffd60a 50%, #ff2d87 70%, transparent);
    opacity: .5;
  }

  .live-badge{
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px;
    background: rgba(255,45,135,.12);
    border: 1px solid rgba(255,45,135,.4);
    border-radius: 999px;
    font-family: 'Anton', Impact, sans-serif;
    font-size: 10px; letter-spacing: .15em;
    color: #ff2d87;
    animation: liveBadgePulse 2s ease-in-out infinite;
  }
  @keyframes liveBadgePulse{
    0%, 100%{ box-shadow: 0 0 0 0 rgba(255,45,135,.4); }
    50%{ box-shadow: 0 0 0 4px rgba(255,45,135,0); }
  }

  .sync-pill{
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px;
    background: rgba(0,255,163,.08);
    border: 1px solid rgba(0,255,163,.25);
    border-radius: 999px;
    font-size: 10px; letter-spacing: .1em;
    color: #00ffa3;
    font-weight: 700;
  }
  .sync-pill .sync-dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: #00ffa3;
    box-shadow: 0 0 8px #00ffa3;
    animation: syncBlink 1.5s ease-in-out infinite;
  }
  @keyframes syncBlink{
    0%, 100%{ opacity: 1; }
    50%{ opacity: .35; }
  }

  .avatar-stack{ display: flex; align-items: center; }
  .avatar-stack .av{
    width: 26px; height: 26px;
    border-radius: 50%;
    background: #161f33;
    border: 2px solid #050811;
    display: grid; place-items: center;
    font-size: 13px;
    margin-left: -8px;
  }
  .avatar-stack .av:first-child{ margin-left: 0; }
  .avatar-stack .av.more{
    background: rgba(0,255,163,.15);
    color: #00ffa3;
    font-size: 10px;
    font-weight: 800;
  }

  .leader-card{
    position: relative;
    background:
      radial-gradient(180px 90px at 50% 0%, rgba(255,214,10,.18), transparent 60%),
      linear-gradient(180deg, rgba(255,214,10,.08) 0%, rgba(255,255,255,0.02) 100%);
    border: 1px solid rgba(255,214,10,.3);
    border-radius: 18px;
    overflow: hidden;
  }
  .leader-card::before{
    content: "👑";
    position: absolute;
    top: -10px; right: 12px;
    font-size: 38px;
    transform: rotate(15deg);
    opacity: .6;
    filter: drop-shadow(0 4px 8px rgba(255,214,10,.4));
    animation: leaderFloat 3s ease-in-out infinite;
  }
  @keyframes leaderFloat{
    0%, 100%{ transform: rotate(15deg) translateY(0); }
    50%{ transform: rotate(15deg) translateY(-4px); }
  }

  .rank-row{
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 14px;
    background: linear-gradient(90deg, rgba(255,255,255,.02), rgba(255,255,255,0));
    border: 1px solid rgba(255,255,255,0.04);
    transition: all .2s;
  }
  .rank-row.is-me{
    background: linear-gradient(90deg, rgba(0,255,163,.08), rgba(0,255,163,.02));
    border-color: rgba(0,255,163,.3);
    box-shadow: 0 0 24px rgba(0,255,163,.08);
  }
  .rank-row.is-top{
    background: linear-gradient(90deg, rgba(255,214,10,.08), rgba(255,214,10,.01));
    border-color: rgba(255,214,10,.25);
  }
  .rank-pos{
    width: 32px; height: 32px;
    display: grid; place-items: center;
    font-family: 'Anton', Impact, sans-serif;
    font-size: 18px;
    border-radius: 10px;
    background: rgba(255,255,255,0.04);
    color: #7a8499;
  }
  .rank-pos.p1{ background: linear-gradient(180deg, #ffd60a, #f0a500); color: #1a0e02; box-shadow: 0 0 16px rgba(255,214,10,.5); }
  .rank-pos.p2{ background: linear-gradient(180deg, #d4d4d8, #a1a1aa); color: #1a0e02; }
  .rank-pos.p3{ background: linear-gradient(180deg, #cd7f32, #8b4513); color: #fff; }
  .rank-avatar{
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #161f33, #0c1322);
    border: 2px solid rgba(255,255,255,0.06);
    display: grid; place-items: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .rank-row.is-me .rank-avatar{
    border-color: rgba(0,255,163,.5);
    box-shadow: 0 0 12px rgba(0,255,163,.3);
  }
  .rank-points{
    font-family: 'Anton', Impact, sans-serif;
    font-size: 22px; line-height: 1;
    color: #e9ecf2;
  }

  .match-mini{
    background: linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 12px;
    transition: all .2s;
  }
  .match-mini:focus-within{
    border-color: rgba(0,255,163,.4);
    box-shadow: 0 0 24px rgba(0,255,163,.1);
  }
  .match-mini.is-live{
    border-color: rgba(255,45,135,.4);
    background:
      radial-gradient(200px 80px at 50% 0%, rgba(255,45,135,.08), transparent 70%),
      linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
  }
  .score-mini-input{
    width: 44px; height: 44px;
    text-align: center;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    color: #e9ecf2;
    font-family: 'Anton', Impact, sans-serif;
    font-size: 22px;
    padding: 0;
    transition: all .2s;
  }
  .score-mini-input:focus{
    outline: none;
    border-color: #00ffa3;
    background: rgba(0,255,163,.08);
    box-shadow: 0 0 16px rgba(0,255,163,.25);
  }
  .score-mini-input::-webkit-outer-spin-button,
  .score-mini-input::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; }
  .score-mini-input[type=number]{ -moz-appearance: textfield; }

  .feed-item{
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    background: linear-gradient(90deg, rgba(255,255,255,.03), rgba(255,255,255,0));
    border: 1px solid rgba(255,255,255,0.04);
    border-radius: 14px;
    animation: feedSlideIn .4s cubic-bezier(.22,1,.36,1);
  }
  @keyframes feedSlideIn{
    from{ opacity: 0; transform: translateX(-8px); }
    to{ opacity: 1; transform: translateX(0); }
  }

  .champion-vote{
    background:
      radial-gradient(220px 120px at 50% 0%, rgba(255,214,10,.18), transparent 60%),
      linear-gradient(180deg, rgba(255,214,10,.04), rgba(255,255,255,.01));
    border: 1px solid rgba(255,214,10,.25);
    border-radius: 18px;
    padding: 12px;
    text-align: center;
    cursor: pointer;
    transition: all .2s;
    position: relative;
  }
  .champion-vote:active{ transform: scale(.97); }
  .champion-vote.selected{
    background:
      radial-gradient(220px 120px at 50% 0%, rgba(255,214,10,.3), transparent 60%),
      linear-gradient(180deg, rgba(255,214,10,.12), rgba(255,255,255,.02));
    border-color: rgba(255,214,10,.6);
    box-shadow: 0 0 24px rgba(255,214,10,.3);
  }
  .champion-vote .vote-bar{
    height: 4px; background: rgba(255,255,255,.06);
    border-radius: 2px; overflow: hidden;
    margin-top: 6px;
  }
  .champion-vote .vote-bar-fill{
    height: 100%;
    background: linear-gradient(90deg, #ffd60a, #f0a500);
    transition: width .8s cubic-bezier(.22,1,.36,1);
  }

  /* ===== TABELA NOSTÁLGICA (papel kraft/jornal antigo) ===== */
  .paper{
    background:
      /* manchas e textura */
      radial-gradient(800px 400px at 80% -20%, rgba(120,80,30,.18), transparent 70%),
      radial-gradient(600px 300px at -10% 110%, rgba(180,140,80,.12), transparent 70%),
      /* base creme/papel envelhecido */
      linear-gradient(180deg, #f4e9cf 0%, #ecddb8 100%);
    color: #2a1c0a;
    border-radius: 18px;
    position: relative;
    box-shadow:
      0 1px 0 rgba(255,255,255,.4) inset,
      0 -2px 12px rgba(120,80,30,.15) inset,
      0 12px 30px rgba(0,0,0,.45);
    overflow: hidden;
  }
  .paper::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='1.4' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.35'/></svg>");
    opacity:.4; mix-blend-mode: multiply;
  }
  .paper::after{
    /* dobra/grain horizontal */
    content:""; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(180deg, transparent 0 18px, rgba(80,40,10,.025) 18px 19px);
  }
  .paper > * { position:relative; z-index:1; }

  /* Tipografia jornal */
  .news-h{ font-family:'Anton', Impact, sans-serif; letter-spacing:.04em; color:#1a0e02; }
  .news-stamp{
    display:inline-block; padding:2px 10px; border:2px solid #b8341d; color:#b8341d;
    font-family:'Bungee',Impact,sans-serif; letter-spacing:.15em;
    transform: rotate(-3deg); border-radius:4px;
    background: rgba(255,255,255,.3);
  }

  /* Tabela classificação estilo planilha impressa */
  .tbl-class{
    width:100%; border-collapse:collapse; font-size:11px;
    font-family: ui-monospace, "SF Mono", monospace;
  }
  .tbl-class th{
    background: #1a0e02; color:#f4e9cf;
    padding: 6px 4px; text-align:center; font-weight:700;
    letter-spacing:.08em; font-size:10px;
  }
  .tbl-class th:nth-child(2){ text-align:left; padding-left:10px; }
  .tbl-class td{
    padding: 5px 4px; text-align:center;
    border-bottom: 1px dashed rgba(80,40,10,.3);
  }

/* Determinar status dinâmico do jogo (live/final/upcoming) baseado em now() */
function matchStatus(m){
  const start = new Date(m.date).getTime();
  const t = Date.now();
  if(t < start) return 'upcoming';
  if(t > start + 2*60*60*1000) return 'final';
  return 'live';
}
function matchMinute(m){
  const elapsed = (Date.now() - new Date(m.date).getTime())/60000;
  return Math.max(1, Math.min(90, Math.floor(elapsed)));
}
function matchStageLabel(m){
  if(m.stage==='G')    return `Grupo ${m.group} · Jogo ${m.n}`;
  if(m.stage==='R32')  return `16-avos · Jogo ${m.n}`;
  if(m.stage==='R16')  return `Oitavas · Jogo ${m.n}`;
  if(m.stage==='QF')   return `Quartas · Jogo ${m.n}`;
  if(m.stage==='SF')   return `Semifinal · Jogo ${m.n}`;
  if(m.stage==='3rd')  return `3º lugar · Jogo ${m.n}`;
  if(m.stage==='F')    return `🏆 FINAL · Jogo ${m.n}`;
  return '';
}

const $ = (sel, el=document) => el.querySelector(sel);

function fmtDate(iso){
  const d = new Date(iso);
  const days = ['DOM','SEG','TER','QUA','QUI','SEX','SAB'];
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');
  return `${days[d.getDay()]} · ${d.getDate()}/${d.getMonth()+1} · ${hh}:${mm}`;
}

function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return 'agora';
  if(s<3600) return Math.floor(s/60)+' min';
  if(s<86400) return Math.floor(s/3600)+' h';
  return Math.floor(s/86400)+' d';
}

function randPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

function score(real, palpite){
  if(!real || !palpite) return 0;
  // exact = 10 ; winner+1diff = 7; winner = 5; only goals = 2
  if(real.a===palpite.a && real.b===palpite.b) return 10;
  const rd = real.a-real.b, pd = palpite.a-palpite.b;
  const sameWinner = (rd>0&&pd>0)||(rd<0&&pd<0)||(rd===0&&pd===0);
  if(sameWinner && Math.abs(rd-pd)<=1) return 7;
  if(sameWinner) return 5;
  if(real.a===palpite.a || real.b===palpite.b) return 2;
  return 0;
}

function toast(msg, type='ok'){
  const root = $('#toast-root');
  const el = document.createElement('div');
  const colors = {
    ok:    'border-neon/40 shadow-glow text-bone',
    warn:  'border-gold/50 shadow-gold text-gold',
    err:   'border-cherry/50 shadow-cherry text-cherry',
  };
  el.className = `toast ${colors[type]||colors.ok} px-4 py-3 rounded-2xl mb-2 animate-slide-up text-sm font-semibold flex items-center gap-2 pointer-events-auto`;
  el.innerHTML = msg;
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .35s, transform .35s'; el.style.opacity='0'; el.style.transform='translateY(-10px)'; setTimeout(()=>el.remove(),400); }, 2600);
}

function confetti(){
  const root = $('#confetti-root');
  const colors = ['#00ffa3','#ffd60a','#ff2d87','#00e5ff','#caff33'];
  for(let i=0;i<60;i++){
    const s = document.createElement('span');
    s.style.left = Math.random()*100+'vw';
    s.style.background = colors[i%colors.length];
    s.style.animationDuration = (1.8+Math.random()*1.6)+'s';
    s.style.animationDelay = (Math.random()*0.4)+'s';
    s.style.transform = `rotate(${Math.random()*360}deg)`;
    root.appendChild(s);
    setTimeout(()=>s.remove(), 3500);
  }
}

function computeRank(){
  const g = state.groups.find(g=>g.id===state.selectedGroupId);
  if(!g) return '—';
  const ranking = buildGroupRanking(g);
  const me = myUid();
  const idx = ranking.findIndex(x=>x.id===me || x.id==='me');
  return idx >= 0 ? (idx+1) : '—';
}
function randIntSeed(seed, min, max){
  let h=0; for(let i=0;i<seed.length;i++){ h = (h*31 + seed.charCodeAt(i))>>>0; }
  return min + (h % (max-min+1));
}

function startCountdown(m){
  const el = document.getElementById('countdown-'+m.id); if(!el) return;
  function tick(){
    const target = new Date(m.date).getTime();
    let diff = target - Date.now();
    if(diff <= 0){ el.innerHTML = '<div class="col-span-4 text-center text-cherry font-bold">⚡ COMEÇOU</div>'; return; }
    const d = Math.floor(diff/86400000); diff -= d*86400000;
    const h = Math.floor(diff/3600000); diff -= h*3600000;
    const mn= Math.floor(diff/60000); diff -= mn*60000;
    const s = Math.floor(diff/1000);
    const cell = (n,l)=>`<div class="bg-carbon border border-white/10 rounded-xl py-2">
      <div class="font-display text-2xl leading-none">${String(n).padStart(2,'0')}</div>
      <div class="text-[9px] tracking-widest text-muted">${l}</div>
    </div>`;
    el.innerHTML = cell(d,'DIAS')+cell(h,'HORAS')+cell(mn,'MIN')+cell(s,'SEG');
  }
  tick(); clearInterval(window.__cd); window.__cd = setInterval(tick,1000);
}

/* ============================================================
   TABELA / CALENDÁRIO NOSTÁLGICO
   Estilo "tabelinha de jornal" pra preencher placar a caneta.
   - Calcula classificação automaticamente (V=3, E=1)
   - Critérios de desempate: Pts > SG > GP > nome
   - Chave de mata-mata mostra vencedores (calculados ou marcados manualmente)
   ============================================================ */

/* Calcula classificação a partir dos placares preenchidos pelo usuário */
function calcStandings(letter){
  const teams = teamsByGroup(letter);
  const stats = {};
  teams.forEach(t => { stats[t.id] = { ...t, P:0, V:0, E:0, D:0, GP:0, GC:0 }; });

  MATCHES.filter(m => m.stage==='G' && m.group===letter).forEach(m => {
    const sc = state.userScores[m.id];
    if(!sc || sc.a==null || sc.b==null) return;
    const A = stats[m.a], B = stats[m.b];
    if(!A || !B) return;
    A.P++; B.P++;
    A.GP += sc.a; A.GC += sc.b;
    B.GP += sc.b; B.GC += sc.a;
    if(sc.a > sc.b){ A.V++; B.D++; }
    else if(sc.a < sc.b){ A.D++; B.V++; }
    else { A.E++; B.E++; }
  });

  const arr = Object.values(stats).map(s => ({
    ...s, SG: s.GP - s.GC, pts: s.V*3 + s.E
  }));
  arr.sort((a,b) => b.pts - a.pts || b.SG - a.SG || b.GP - a.GP || a.name.localeCompare(b.name));
  return arr;
}

/* Retorna { firsts, seconds, thirds } com os classificados */
function getQualifiedAll(){
  const firsts = {}, seconds = {}, thirds = {};
  GROUP_LETTERS.forEach(L => {
    const s = calcStandings(L);
    firsts[L] = s[0];
    seconds[L] = s[1];
    thirds[L] = s[2];
  });
  // Top 8 terceiros
  const top3sorted = GROUP_LETTERS.map(L => ({ L, t: thirds[L] }))
    .sort((a,b) => b.t.pts - a.t.pts || b.t.SG - a.t.SG || b.t.GP - a.t.GP);
  return { firsts, seconds, thirds, top8thirds: top3sorted.slice(0,8) };
}

function setUserScore(matchId, side, value){
  const v = value === '' ? null : Math.max(0, Math.min(99, parseInt(value)||0));
  state.userScores[matchId] = state.userScores[matchId] || { a:null, b:null };
  state.userScores[matchId][side] = v;
  if(state.userScores[matchId].a==null && state.userScores[matchId].b==null){
    delete state.userScores[matchId];
  }
  saveState();
  // Atualiza só as classificações da tela sem repintar tudo
  updateStandingsInPlace();
  updateBracketInPlace();
}

/* Atualiza só as tabelinhas de classificação visíveis */
function updateStandingsInPlace(){
  GROUP_LETTERS.forEach(L => {
    const tbody = document.getElementById('tbody-' + L);
    if(!tbody) return;
    tbody.innerHTML = renderStandingsRows(L);
  });
}
function updateBracketInPlace(){
  const wrap = document.getElementById('bracket-wrap');
  if(wrap) wrap.innerHTML = renderBracket();
}

function renderStandingsRows(L){
  const standings = calcStandings(L);
  return standings.map((t,i) => {
    const cls = i===0?'q1' : i===1?'q2' : i===2?'q3' : 'qF';
    return `
      <tr class="${cls}">
        <td>${i+1}</td>
        <td>${t.flag} ${t.name}</td>
        <td>${t.P}</td>
        <td>${t.V}</td>
        <td>${t.E}</td>
        <td>${t.D}</td>
        <td>${t.GP}</td>
        <td>${t.GC}</td>
        <td>${t.SG>0?'+':''}${t.SG}</td>
        <td><b>${t.pts}</b></td>
      </tr>
    `;
  }).join('');
}

/* ===== CHAVE DO MATA-MATA ===== */
/* Estrutura simplificada: 16 confrontos -> 8 -> 4 -> 2 -> 1
   Os 16 jogos de R32 já existem em MATCHES com placeholders.
   Vamos derivar os "donos" das vagas a partir das classificações + 8 melhores 3os. */

/* Tabela de cruzamentos do R32 (conforme calendário oficial 2026)
   Cada item: { id da partida, vaga1, vaga2 } */
const KO_MAPPING = [
  { id:'r1',  v1:{type:'2nd', group:'A'},   v2:{type:'2nd', group:'B'} },           // Jogo 73
  { id:'r2',  v1:{type:'1st', group:'C'},   v2:{type:'2nd', group:'F'} },           // Jogo 76
  { id:'r3',  v1:{type:'1st', group:'E'},   v2:{type:'3rd', pool:['A','B','C','D','F']} }, // Jogo 74
  { id:'r4',  v1:{type:'1st', group:'F'},   v2:{type:'2nd', group:'C'} },           // Jogo 75
  { id:'r5',  v1:{type:'2nd', group:'E'},   v2:{type:'2nd', group:'I'} },           // Jogo 78
  { id:'r6',  v1:{type:'1st', group:'I'},   v2:{type:'3rd', pool:['C','D','F','G','H']} }, // Jogo 77
  { id:'r7',  v1:{type:'1st', group:'A'},   v2:{type:'3rd', pool:['C','E','F','H','I']} }, // Jogo 79
  { id:'r8',  v1:{type:'1st', group:'L'},   v2:{type:'3rd', pool:['E','H','I','J','K']} }, // Jogo 80
  { id:'r9',  v1:{type:'1st', group:'G'},   v2:{type:'3rd', pool:['A','E','H','I','J']} }, // Jogo 82
  { id:'r10', v1:{type:'1st', group:'D'},   v2:{type:'3rd', pool:['B','E','F','I','J']} }, // Jogo 81
  { id:'r11', v1:{type:'1st', group:'B'},   v2:{type:'3rd', pool:['E','F','G','I','J']} }, // Jogo 85
  { id:'r12', v1:{type:'1st', group:'H'},   v2:{type:'2nd', group:'J'} },           // Jogo 84
  { id:'r13', v1:{type:'2nd', group:'K'},   v2:{type:'2nd', group:'L'} },           // Jogo 83
  { id:'r14', v1:{type:'2nd', group:'D'},   v2:{type:'2nd', group:'G'} },           // Jogo 88
  { id:'r15', v1:{type:'1st', group:'J'},   v2:{type:'2nd', group:'H'} },           // Jogo 86
  { id:'r16', v1:{type:'1st', group:'K'},   v2:{type:'3rd', pool:['D','E','I','J','L']} }, // Jogo 87
];

/* Resolve a vaga (1st/2nd/3rd) num teamId, se possível */
function resolveSlot(slot, qual){
  if(slot.type==='1st'){
    const t = qual.firsts[slot.group];
    return t && t.P>0 ? t : null;
  }
  if(slot.type==='2nd'){
    const t = qual.seconds[slot.group];
    return t && t.P>0 ? t : null;
  }
  if(slot.type==='3rd'){
    // Pega o melhor terceiro entre os top8 cujo grupo está no pool
    const candidates = qual.top8thirds.filter(x => slot.pool.includes(x.L));
    return candidates.length ? candidates[0].t : null;
  }
  return null;
}

/* Cruzamentos das oitavas (R16) -> determinados pelo regulamento FIFA 2026 */
const KO_BRACKET = {
  // R16 (oitavas, 8 partidas) — cada uma cruza 2 jogos de R32
  o1: ['r1','r4'],   // V73 x V75
  o2: ['r3','r6'],   // V74 x V77
  o3: ['r2','r5'],   // V76 x V78
  o4: ['r7','r8'],   // V79 x V80
  o5: ['r13','r12'], // V83 x V84
  o6: ['r10','r9'],  // V81 x V82
  o7: ['r15','r14'], // V86 x V88
  o8: ['r11','r16'], // V85 x V87
  // QF (quartas)
  q1: ['o2','o1'],   // V89 x V90
  q2: ['o5','o6'],   // V93 x V94
  q3: ['o3','o4'],   // V91 x V92
  q4: ['o7','o8'],   // V95 x V96 (corrigido: ordem oficial Tabela)
  // SF
  s1: ['q1','q2'],
  s2: ['q3','q4'],
  // Final
  f1: ['s1','s2'],
};

/* Vencedor de um confronto:
   - Se userScores tem placar e há diferença: vence quem fez mais gol
   - Senão, se koWinners[matchId] está marcado, usa
   - Senão, null */
function winnerOfMatch(matchId, slotsResolved){
  // Para r* (R32): slots já resolvidos
  const sc = state.userScores[matchId];
  const slots = slotsResolved;
  if(sc && sc.a!=null && sc.b!=null && sc.a!==sc.b && slots && slots.a && slots.b){
    return sc.a > sc.b ? slots.a : slots.b;
  }
  // Manualmente marcado
  if(state.koWinners[matchId]){
    return TEAMS.find(t => t.id===state.koWinners[matchId]) || null;
  }
  return null;
}

function renderBracket(){
  const qual = getQualifiedAll();

  // Resolve R32
  const r32 = {};
  KO_MAPPING.forEach(km => {
    const a = resolveSlot(km.v1, qual);
    const b = resolveSlot(km.v2, qual);
    r32[km.id] = { a, b, winner: null, slot1Label: labelSlot(km.v1), slot2Label: labelSlot(km.v2) };
    r32[km.id].winner = winnerOfMatch(km.id, { a, b });
  });

  // Resolve R16
  const r16 = {};
  Object.keys(KO_BRACKET).filter(k=>k.startsWith('o')).forEach(oid => {
    const [src1, src2] = KO_BRACKET[oid];
    const a = r32[src1]?.winner || null;
    const b = r32[src2]?.winner || null;
    r16[oid] = { a, b, winner: winnerOfMatch(oid, { a, b }) };
  });
  // Resolve QF
  const qf = {};
  ['q1','q2','q3','q4'].forEach(qid => {
    const [s1,s2] = KO_BRACKET[qid];
    const a = r16[s1]?.winner || null;
    const b = r16[s2]?.winner || null;
    qf[qid] = { a, b, winner: winnerOfMatch(qid, { a, b }) };
  });
  // Resolve SF
  const sf = {};
  ['s1','s2'].forEach(sid => {
    const [s1,s2] = KO_BRACKET[sid];
    const a = qf[s1]?.winner || null;
    const b = qf[s2]?.winner || null;
    sf[sid] = { a, b, winner: winnerOfMatch(sid, { a, b }) };
  });
  // Final
  const fnA = sf.s1?.winner || null;
  const fnB = sf.s2?.winner || null;
  const finalMatch = { a: fnA, b: fnB, winner: winnerOfMatch('f1', { a:fnA, b:fnB }) };
  const champion = finalMatch.winner;

  /* Renderiza um "match box" da chave */
  const box = (id, m, fb1='?', fb2='?', big=false) => {
    const w = m.winner;
    const aIsWin = w && m.a && w.id===m.a.id;
    const bIsWin = w && m.b && w.id===m.b.id;
    const aIsLose = w && m.a && w.id!==m.a.id;
    const bIsLose = w && m.b && w.id!==m.b.id;
    const cls1 = aIsWin?'winner':aIsLose?'loser':'';
    const cls2 = bIsWin?'winner':bIsLose?'loser':'';
    const t1 = m.a ? `<span class="bk-flag">${m.a.flag}</span><span class="bk-name">${m.a.name}</span>` : `<span class="bk-name" style="color:#888">${fb1}</span>`;
    const t2 = m.b ? `<span class="bk-flag">${m.b.flag}</span><span class="bk-name">${m.b.name}</span>` : `<span class="bk-name" style="color:#888">${fb2}</span>`;
    const clickable = m.a && m.b ? `onclick="cycleKoWinner('${id}')" style="cursor:pointer"` : '';
    return `
      <div class="bk-match ${big?'bk-final':''}" ${clickable} title="${m.a&&m.b?'Toque para marcar vencedor':''}">
        <div class="bk-team ${cls1}">${t1}</div>
        <div class="bk-team ${cls2}">${t2}</div>
      </div>
    `;
  };

  // Champion celebration
  const champBox = champion
    ? `<div class="bk-champ-trophy" style="background:linear-gradient(180deg,#ffd60a,#f0a500);border:2px solid #1a0e02;border-radius:8px;margin-top:8px">
         🏆 ${champion.flag} ${champion.name.toUpperCase()} 🏆
       </div>`
    : `<div class="bk-champ-trophy" style="background:rgba(255,255,255,.4);border:2px dashed #1a0e02;border-radius:8px;margin-top:8px">
         🏆 CAMPEÃO?
       </div>`;

  return `
    <div class="bracket-inner">
      <div class="bk-col">
        <div class="bk-col-title">16-AVOS</div>
        ${KO_MAPPING.map(km => box(km.id, r32[km.id], km.v1.type==='3rd'?'3º':km.v1.group, km.v2.type==='3rd'?'3º':km.v2.group)).join('')}
      </div>
      <div class="bk-col">
        <div class="bk-col-title">OITAVAS</div>
        ${['o1','o2','o3','o4','o5','o6','o7','o8'].map(o => box(o, r16[o])).join('')}
      </div>
      <div class="bk-col">
        <div class="bk-col-title">QUARTAS</div>
        ${['q1','q2','q3','q4'].map(q => box(q, qf[q])).join('')}
      </div>
      <div class="bk-col">
        <div class="bk-col-title">SEMIS</div>
        ${['s1','s2'].map(s => box(s, sf[s])).join('')}
      </div>
      <div class="bk-col" style="justify-content:center">
        <div class="bk-col-title">FINAL</div>
        ${box('f1', finalMatch, '', '', true)}
        ${champBox}
      </div>
    </div>
  `;
}

function labelSlot(s){
  if(s.type==='1st') return '1º '+s.group;
  if(s.type==='2nd') return '2º '+s.group;
  return '3º';
}

/* Ciclo de vencedor manual (toque no card da chave) — só vale quando placar do jogo não decide */
function cycleKoWinner(matchId){
  // Descobre os dois competidores resolvidos no momento
  const qual = getQualifiedAll();
  let a=null, b=null;
  // R32
  const km = KO_MAPPING.find(x => x.id===matchId);
  if(km){
    a = resolveSlot(km.v1, qual);
    b = resolveSlot(km.v2, qual);
  } else {
    // R16/QF/SF/F — recalcula recursivamente
    const recalc = renderBracketResolveOnly();
    if(recalc[matchId]){ a = recalc[matchId].a; b = recalc[matchId].b; }
  }
  if(!a || !b) return;

  // Se o jogo é R32 e já tem placar definindo vencedor, mostra aviso
  if(km){
    const sc = state.userScores[matchId];
    if(sc && sc.a!=null && sc.b!=null && sc.a!==sc.b){
      toast('Este jogo já tem placar definindo o vencedor.','warn'); return;
    }
  }

  const cur = state.koWinners[matchId];
  let next;
  if(!cur)         next = a.id;
  else if(cur===a.id) next = b.id;
  else             next = null; // limpa
  if(next) state.koWinners[matchId] = next;
  else     delete state.koWinners[matchId];
  saveState();
  updateBracketInPlace();
}

/* Versão "só resolve" — sem renderizar, pra uso interno do cycleKoWinner */
function renderBracketResolveOnly(){
  const qual = getQualifiedAll();
  const r32 = {};
  KO_MAPPING.forEach(km => {
    const a = resolveSlot(km.v1, qual);
    const b = resolveSlot(km.v2, qual);
    r32[km.id] = { a, b, winner: winnerOfMatch(km.id, { a, b }) };
  });
  const r16 = {};
  ['o1','o2','o3','o4','o5','o6','o7','o8'].forEach(oid => {
    const [s1,s2] = KO_BRACKET[oid];
    const a = r32[s1]?.winner||null, b = r32[s2]?.winner||null;
    r16[oid] = { a, b, winner: winnerOfMatch(oid, { a, b }) };
  });
  const qf = {};
  ['q1','q2','q3','q4'].forEach(qid => {
    const [s1,s2] = KO_BRACKET[qid];
    const a = r16[s1]?.winner||null, b = r16[s2]?.winner||null;
    qf[qid] = { a, b, winner: winnerOfMatch(qid, { a, b }) };
  });
  const sf = {};
  ['s1','s2'].forEach(sid => {
    const [s1,s2] = KO_BRACKET[sid];
    const a = qf[s1]?.winner||null, b = qf[s2]?.winner||null;
    sf[sid] = { a, b, winner: winnerOfMatch(sid, { a, b }) };
  });
  const f1 = { a: sf.s1?.winner||null, b: sf.s2?.winner||null };
  f1.winner = winnerOfMatch('f1', f1);
  return { ...r32, ...r16, ...qf, ...sf, f1 };
}

function openPredictModal(matchId){
  const m = MATCHES.find(x=>x.id===matchId); if(!m) return;
  const tA = teamById(m.a), tB = teamById(m.b);
  const existing = state.predictions[matchId] || { a:0, b:0 };

  openModal(`
    <div class="px-5 pt-5 pb-8">
      <div class="flex items-center justify-between mb-3">
        <div class="text-[10px] tracking-widest text-muted">${matchStageLabel(m)} · ${fmtDate(m.date)}${m.city?' · '+m.city:''}</div>
        <button onclick="closeModal()" class="text-muted text-2xl leading-none">×</button>
      </div>
      <div class="font-display text-2xl mb-1">SEU PALPITE</div>
      <div class="text-muted text-sm mb-5">Acerte o placar exato e ganhe <span class="text-neon font-bold">+10 pontos</span>.</div>

      <div class="card-elev p-5">
        <div class="grid grid-cols-3 items-center gap-2">
          <div class="text-center">
            <div class="text-5xl">${tA.flag}</div>
            <div class="text-xs mt-2 font-bold">${tA.name}</div>
          </div>
          <div class="text-center text-muted font-display text-4xl">x</div>
          <div class="text-center">
            <div class="text-5xl">${tB.flag}</div>
            <div class="text-xs mt-2 font-bold">${tB.name}</div>
          </div>
        </div>

        <div class="grid grid-cols-3 items-center gap-2 mt-5">
          ${scoreStepper('a', existing.a)}
          <div class="text-center font-display text-3xl text-muted">·</div>
          ${scoreStepper('b', existing.b)}
        </div>
      </div>

      <div class="mt-4 grid grid-cols-3 gap-2 text-center text-[10px] text-muted">
        <div class="card p-2"><div class="text-bone font-display text-lg">10</div> Placar exato</div>
        <div class="card p-2"><div class="text-bone font-display text-lg">7</div> Saldo +1</div>
        <div class="card p-2"><div class="text-bone font-display text-lg">5</div> Só vencedor</div>
      </div>

      <button id="confirm-predict" class="btn-primary w-full py-3.5 rounded-2xl font-display tracking-widest text-base mt-5">
        CONFIRMAR PALPITE
      </button>
      ${state.predictions[matchId]?`
        <button class="w-full py-3 rounded-2xl btn-ghost text-cherry font-bold text-sm mt-2" onclick="removePredict('${matchId}')">
          Excluir palpite
        </button>`:''}
    </div>
  `);

  // wiring
  let a = existing.a, b = existing.b;
  const upd = ()=>{ a = parseInt($('#sc-a').textContent)||0; b = parseInt($('#sc-b').textContent)||0; };
  $$('[data-step]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const side = btn.dataset.side; const dir = parseInt(btn.dataset.step);
      const el = $('#sc-'+side);
      let v = parseInt(el.textContent)+dir;
      v = Math.max(0, Math.min(15, v));
      el.textContent = v; el.classList.add('animate-pop'); setTimeout(()=>el.classList.remove('animate-pop'),300);
    });
  });
  $('#confirm-predict').addEventListener('click', ()=>{
    upd();
    const prediction = { a, b, ts: Date.now() };
    state.predictions[matchId] = prediction;
    saveState();
    // Sincroniza com a nuvem
    CloudSync.publishPrediction(matchId, prediction);
    closeModal();
    confetti();
    toast(`✅ Palpite registrado: <span class="font-display">${a} x ${b}</span>`,'ok');
    renderHUD(); refreshActiveScreen();
  });
}

function scoreStepper(side, value){
  return `
    <div class="text-center">
      <div class="flex items-center justify-center gap-2">
        <button data-step="-1" data-side="${side}" class="w-10 h-10 rounded-full btn-ghost text-xl font-bold">−</button>
        <div id="sc-${side}" class="font-display text-6xl w-20">${value}</div>
        <button data-step="1" data-side="${side}" class="w-10 h-10 rounded-full btn-ghost text-xl font-bold">+</button>
      </div>

  `;
}

function removePredict(id){
  delete state.predictions[id]; saveState(); closeModal();

}

/* Listener em tempo real do grupo aberto. Mantém um único ativo. */
function startGroupActivityListener(groupId){
  // Cancela listener anterior se existir
  if(window._groupActivityUnsub){
    try{ window._groupActivityUnsub(); }catch(e){}
    window._groupActivityUnsub = null;
  }
  if(!window.CloudSync || !window.CloudSync.subscribeGroupActivity) return;

  window._groupActivityCache = window._groupActivityCache || {};
  setSyncStatus('syncing');

  window._groupActivityUnsub = window.CloudSync.subscribeGroupActivity(groupId, (items, err) => {
    if(err){
      setSyncStatus('error');
      return;
    }
    window._groupActivityCache[groupId] = items || [];
    setSyncStatus('ok');

    // Re-renderiza a seção de palpites do grupo se a aba "matches" estiver aberta
    const tab = window._groupDetailTab || 'matches';
    if(tab === 'matches'){
      const container = document.getElementById('group-activity-list');
      if(container){
        container.innerHTML = renderGroupActivityList(items || []);
      }
    }
  });
}

function closeGroupDetailModal(){
  if(window._groupActivityUnsub){
    try{ window._groupActivityUnsub(); }catch(e){}
    window._groupActivityUnsub = null;
  }
  closeModal();
}

function setGroupDetailTab(groupId, tab){
  window._groupDetailTab = tab;
  const g = state.groups.find(x=>x.id===groupId);
  if(g) renderGroupDetailContent(g);
}

/* ===== SEÇÃO 1: JOGOS DO DIA (palpite inline) ===== */
function renderGroupMatches(g){
  const now = new Date();
  const today = now.toDateString();

  // Jogos: hoje (ao vivo + próximos do dia) + próximos 3 não-de-hoje
  const todayMatches = MATCHES.filter(m=>{
    if(!m.a || !m.b) return false;
    return new Date(m.date).toDateString() === today;
  });
  const upcomingMatches = MATCHES.filter(m=>{
    if(!m.a || !m.b) return false;
    if(matchStatus(m) !== 'upcoming') return false;
    return new Date(m.date).toDateString() !== today;
  }).slice(0, 5);

  // Palpites do grupo (Firestore em tempo real)
  const cached = (window._groupActivityCache && window._groupActivityCache[g.id]) || [];

  return `
    ${todayMatches.length > 0 ? `
      <div class="mb-4">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-display tracking-wider text-base">JOGOS DE HOJE</h3>
          <span class="text-[10px] text-muted">${todayMatches.length} jogo${todayMatches.length>1?'s':''}</span>
        </div>
        <div class="space-y-2">
          ${todayMatches.map(m => renderInlineMatchCard(m)).join('')}
        </div>
      </div>
    ` : `
      <div class="card p-4 text-center text-sm text-muted mb-4">
        🍿 Sem jogos hoje. Os próximos estão aí embaixo.
      </div>
    `}

    ${upcomingMatches.length > 0 ? `
      <div class="mb-4">
        <div class="flex items-center justify-between mb-2">
          <h3 class="font-display tracking-wider text-base">PRÓXIMOS</h3>
          <span class="text-[10px] text-muted">palpite até 30min antes</span>
        </div>
        <div class="space-y-2">
          ${upcomingMatches.map(m => renderInlineMatchCard(m)).join('')}
        </div>
      </div>
    ` : ''}

    <!-- Palpites do Grupo (tempo real) -->
    <div class="mb-2">
      <div class="flex items-center justify-between mb-2">
        <h3 class="font-display tracking-wider text-base">PALPITES DO GRUPO</h3>
        <span class="text-[10px] text-muted">atualiza em tempo real</span>
      </div>
      <div id="group-activity-list" class="space-y-3">
        ${renderGroupActivityList(cached)}
      </div>
    </div>
  `;
}

/* Renderiza a lista de palpites do grupo, agrupados por jogo.
   Dentro de cada jogo, ordena por updatedAt DESC (mais recente em cima). */
function renderGroupActivityList(items){
  if(!items || items.length === 0){
    return `
      <div class="card p-5 text-center">
        <div class="text-3xl mb-2">📡</div>
        <div class="text-sm text-muted">Nenhum palpite no grupo ainda.</div>
        <div class="text-[11px] text-muted mt-1">Seja o primeiro — registre acima 👆</div>
      </div>
    `;
  }

  // Agrupa por matchId
  const byMatch = {};
  items.forEach(it => {
    if(!byMatch[it.matchId]) byMatch[it.matchId] = [];
    byMatch[it.matchId].push(it);
  });

  // Ordena cada grupo: mais recente primeiro
  Object.values(byMatch).forEach(arr => {
    arr.sort((a,b) => {
      const ta = a.updatedAt?.toMillis?.() || a.updatedAt?.seconds*1000 || 0;
      const tb = b.updatedAt?.toMillis?.() || b.updatedAt?.seconds*1000 || 0;
      return tb - ta;
    });
  });

  // Ordena jogos: pelo updatedAt do palpite mais recente do jogo
  const matchIds = Object.keys(byMatch).sort((a,b) => {
    const ta = byMatch[a][0].updatedAt?.toMillis?.() || byMatch[a][0].updatedAt?.seconds*1000 || 0;
    const tb = byMatch[b][0].updatedAt?.toMillis?.() || byMatch[b][0].updatedAt?.seconds*1000 || 0;
    return tb - ta;
  });

  const me = myUid();

  return matchIds.map(mid => {
    const arr = byMatch[mid];
    const first = arr[0];
    const m = MATCHES.find(x=>x.id===mid);
    const tA = m ? teamById(m.a) : null;
    const tB = m ? teamById(m.b) : null;
    const flagA = first.flagA || tA?.flag || '⚽';
    const flagB = first.flagB || tB?.flag || '⚽';
    const nameA = first.timeA || tA?.name || '';
    const nameB = first.timeB || tB?.name || '';

    return `
      <div class="card p-3">
        <!-- Cabeçalho do jogo -->
        <div class="flex items-center gap-2 mb-2 pb-2 border-b border-white/5">
          <span class="text-lg">${flagA}</span>
          <span class="text-xs font-bold truncate">${nameA}</span>
          <span class="text-muted text-xs">×</span>
          <span class="text-xs font-bold truncate">${nameB}</span>
          <span class="text-lg">${flagB}</span>
          <span class="ml-auto text-[9px] text-muted tracking-widest">${first.stageLabel||''}</span>
        </div>

        <!-- Palpites dos membros -->
        <div class="space-y-1.5">
          ${arr.map(p => {
            const isMe = p.userId === me;
            const tsMs = p.updatedAt?.toMillis?.() || p.updatedAt?.seconds*1000 || Date.now();
            return `
              <div class="feed-item ${isMe?'is-me':''}" style="${isMe?'background:linear-gradient(90deg, rgba(0,255,163,.08), rgba(0,255,163,.02)); border-color:rgba(0,255,163,.25);':''}">
                <div class="rank-avatar" style="width:32px;height:32px;font-size:14px">${p.userAvatar||'🙂'}</div>
                <div class="flex-1 min-w-0">
                  <div class="text-xs font-bold ${isMe?'text-neon':'text-bone'} truncate">${p.userName||'Membro'}${isMe?' (você)':''}</div>
                  <div class="text-[10px] text-muted">${timeAgo(tsMs)}</div>
                </div>
                <div class="font-display text-xl ${isMe?'text-neon':'text-bone'}">
                  ${p.placarA} <span class="text-muted text-sm">×</span> ${p.placarB}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  }).join('');
}

function renderInlineMatchCard(m){
  const tA = teamById(m.a), tB = teamById(m.b);
  if(!tA || !tB) return '';
  const pal = state.predictions[m.id];
  const status = matchStatus(m);
  const isLive = status==='live';
  const isFinal = status==='final';
  const isUpcoming = status==='upcoming';

  const d = new Date(m.date);
  const hh = String(d.getHours()).padStart(2,'0');
  const mm = String(d.getMinutes()).padStart(2,'0');

  return `
    <div class="match-mini ${isLive?'is-live':''}" id="match-mini-${m.id}">
      <div class="flex items-center justify-between text-[10px] mb-2">
        <span class="text-muted tracking-wider">${matchStageLabel(m)}</span>
        ${isLive ? '<span class="live-badge"><span class="live-dot"></span> AO VIVO</span>' :
          isFinal ? '<span class="text-muted">ENCERRADO</span>' :
          `<span class="text-bone font-bold">${hh}:${mm}</span>`}
      </div>

      <div class="grid grid-cols-[1fr,auto,1fr] gap-3 items-center">
        <!-- Time A -->
        <div class="text-center">
          <div class="text-3xl">${tA.flag}</div>
          <div class="text-[11px] mt-1 font-bold truncate">${tA.name}</div>
        </div>

        <!-- Centro: placar ou input -->
        ${isUpcoming ? `
          <div class="flex items-center gap-1">
            <input type="number" min="0" max="20" inputmode="numeric"
                   class="score-mini-input" data-match="${m.id}" data-side="a"
                   value="${pal?.a ?? ''}"
                   placeholder="0"
                   onchange="onInlineScoreChange('${m.id}')" />
            <span class="text-muted font-display text-xl">×</span>
            <input type="number" min="0" max="20" inputmode="numeric"
                   class="score-mini-input" data-match="${m.id}" data-side="b"
                   value="${pal?.b ?? ''}"
                   placeholder="0"
                   onchange="onInlineScoreChange('${m.id}')" />
          </div>
        ` : m.score ? `
          <div class="text-center">
            <div class="font-display text-3xl ${isLive?'text-cherry':''}">
              ${m.score.a} <span class="text-muted text-xl">·</span> ${m.score.b}
            </div>
            ${isLive ? `<div class="text-[10px] text-cherry font-bold mt-0.5">⚡ ${matchMinute(m)}ʹ</div>` : ''}
          </div>
        ` : `
          <div class="text-center">
            <div class="font-display text-2xl text-muted">VS</div>
          </div>
        `}

        <!-- Time B -->
        <div class="text-center">
          <div class="text-3xl">${tB.flag}</div>
          <div class="text-[11px] mt-1 font-bold truncate">${tB.name}</div>
        </div>
      </div>

      ${isUpcoming ? `
        <button class="mt-3 w-full py-2.5 rounded-xl text-xs font-bold transition-all ${pal?'btn-ghost text-neon':'btn-primary'}"
                onclick="saveInlinePrediction('${m.id}')">
          ${pal ? `✓ PALPITE SALVO: ${pal.a} × ${pal.b} · EDITAR` : '🎯 REGISTRAR PALPITE'}
        </button>
      ` : pal ? `
        <div class="mt-3 flex items-center justify-between text-[11px] px-3 py-2 rounded-xl bg-white/[0.04] border border-white/10">
          <span class="text-muted">Seu palpite: <span class="font-bold text-bone">${pal.a} × ${pal.b}</span></span>
          ${isFinal && m.score ? (()=>{
            const pts = score(m.score, pal);
            return `<span class="font-bold ${pts>=7?'text-neon':pts>0?'text-gold':'text-cherry'}">${pts>0?`+${pts} pts`:'0 pts'}</span>`;
          })() : ''}
        </div>
      ` : ''}
    </div>
  `;
}

/* Handler do input — só atualiza visual, não salva ainda */
function onInlineScoreChange(matchId){
  // Validação leve
  const a = document.querySelector(`[data-match="${matchId}"][data-side="a"]`);
  const b = document.querySelector(`[data-match="${matchId}"][data-side="b"]`);
  if(a){ a.value = Math.max(0, Math.min(20, parseInt(a.value)||0)); }
  if(b){ b.value = Math.max(0, Math.min(20, parseInt(b.value)||0)); }
}

/* Botão SALVAR PALPITE inline */
async function saveInlinePrediction(matchId){
  const aEl = document.querySelector(`[data-match="${matchId}"][data-side="a"]`);
  const bEl = document.querySelector(`[data-match="${matchId}"][data-side="b"]`);
  if(!aEl || !bEl){ toast('Erro ao salvar.','err'); return; }
  const a = parseInt(aEl.value);
  const b = parseInt(bEl.value);
  if(isNaN(a) || isNaN(b)){ toast('Preencha o placar.','warn'); return; }

  const prediction = { a, b, ts: Date.now() };
  state.predictions[matchId] = prediction;
  saveState();

  // Status visual de sincronização
  setSyncStatus('syncing');

  const g = state.groups.find(x=>x.id===state.selectedGroupId);
  const m = MATCHES.find(x=>x.id===matchId);
  const tA = m ? teamById(m.a) : null;
  const tB = m ? teamById(m.b) : null;

  // Sincronização paralela: palpite pessoal + palpite no grupo
  try{
    const tasks = [];

    if(window.CloudSync && window.CloudSync.publishPrediction){
      tasks.push(window.CloudSync.publishPrediction(matchId, prediction));
    }

    if(g && window.CloudSync && window.CloudSync.publishGroupPrediction){
      const matchMeta = {
        timeA: tA?.name || '',
        timeB: tB?.name || '',
        flagA: tA?.flag || '',
        flagB: tB?.flag || '',
        matchDate: m?.date || null,
        stageLabel: m ? matchStageLabel(m) : '',
      };
      tasks.push(window.CloudSync.publishGroupPrediction(g.id, matchId, prediction, matchMeta));
    }

    await Promise.all(tasks);
    setSyncStatus('ok');
    toast(`✅ Palpite salvo: <span class="font-display">${a} × ${b}</span>`,'ok');
    confetti();
  } catch(err){
    console.error('Falha ao sincronizar palpite:', err);
    setSyncStatus('error');
    toast('⚠️ Erro ao salvar, tente novamente.','err');
  }

  // Re-renderiza o conteúdo da aba (mesmo em erro — palpite está em state)
  if(g) renderGroupDetailContent(g);
}

/* Atualiza o pill de status global de sync — funciona em qualquer tela */
function setSyncStatus(state){
  // states: 'syncing' | 'ok' | 'error' | 'idle'
  window._syncStatus = state;
  // Atualiza todos os elementos com data-sync-pill
  document.querySelectorAll('[data-sync-pill]').forEach(el => {
    el.innerHTML = renderSyncPill();
  });
}

function renderSyncPill(){
  const s = window._syncStatus || 'idle';
  if(s === 'syncing'){
    return `<span class="sync-pill" style="background:rgba(0,229,255,.1); border-color:rgba(0,229,255,.4); color:#00e5ff">
      <span class="sync-dot" style="background:#00e5ff; box-shadow:0 0 8px #00e5ff"></span> ATUALIZANDO...
    </span>`;
  }
  if(s === 'error'){
    return `<span class="sync-pill" style="background:rgba(255,45,135,.1); border-color:rgba(255,45,135,.4); color:#ff2d87">
      <span class="sync-dot" style="background:#ff2d87; box-shadow:0 0 8px #ff2d87; animation:none"></span> ERRO
    </span>`;
  }
  // ok / idle (mesmo visual quando online)
  const isOnline = window.CloudSync && window.CloudSync.isOnline && window.CloudSync.isOnline();
  if(!isOnline){
    return `<span class="text-[10px] text-muted">offline</span>`;
  }
  return `<span class="sync-pill"><span class="sync-dot"></span> SINCRONIZADO</span>`;
}

/* ===== SEÇÃO 3: BOLÃO LONGO PRAZO (escolher campeão + ver votação) ===== */
function renderGroupChampionVote(g){
  const me = myUid();
  const myChampion = state.longterm?.champion;

  // Computa votação: pra cada membro, lê o palpite de campeão (se houver no _userCache)
  const votes = {};  // teamId -> [{uid, avatar, name}]
  const totalMembers = (g.members||[]).length;
  let totalVotes = 0;

  (g.members||[]).forEach(uid => {
    let champion = null;
    if(uid === me){
      champion = myChampion;
    } else {
      const cached = window._userCache && window._userCache[uid];
      champion = cached?.championPick || null;
    }
    if(champion){
      totalVotes++;
      votes[champion] = votes[champion] || [];
      const cached = window._userCache && window._userCache[uid];
      votes[champion].push({
        uid,
        avatar: uid===me ? state.user.avatar : (cached?.avatar || '🙂'),
        name: uid===me ? state.user.name : (cached?.displayName || 'Membro'),
        isMe: uid===me
      });
    }
  });

  // Times com pelo menos 1 voto, ordenados por contagem
  const votedTeams = Object.keys(votes)
    .map(tid => ({ team: teamById(tid), team_id: tid, voters: votes[tid] }))
    .filter(x => x.team)
    .sort((a,b) => b.voters.length - a.voters.length);

  // Top 8 times pra votar (favoritos + os já votados)
  const topTeams = TEAMS.slice(0, 12);

  return `
    <!-- Header -->
    <div class="champion-vote mb-4" style="cursor:default">
      <div class="text-3xl mb-1">🏆</div>
      <div class="font-display text-xl leading-tight">QUEM LEVA A TAÇA?</div>
      <div class="text-xs text-muted mt-1">Vote no seu campeão · Bônus de <span class="text-gold font-bold">+250 pts</span> se acertar</div>
    </div>

    <!-- Sua escolha atual -->
    ${myChampion ? (() => {
      const t = teamById(myChampion);
      return t ? `
        <div class="card p-3 mb-4 flex items-center gap-3" style="background:rgba(0,255,163,.06); border:1px solid rgba(0,255,163,.25)">
          <div class="text-3xl">${t.flag}</div>
          <div class="flex-1">
            <div class="text-[10px] text-neon tracking-widest font-bold">SEU CAMPEÃO</div>
            <div class="font-display text-lg">${t.name}</div>
          </div>
          <span class="text-[10px] text-muted">${state.longterm.locked?'🔒 travado':'editável'}</span>
        </div>
      ` : '';
    })() : `
      <div class="card p-3 mb-4 text-center">
        <div class="text-xs text-muted">Escolha um time abaixo pra registrar seu palpite de campeão.</div>
      </div>
    `}

    <!-- Grid de votação -->
    <div class="mb-4">
      <h3 class="font-display tracking-wider text-base mb-2">ESCOLHA SEU CAMPEÃO</h3>
      <div class="grid grid-cols-3 gap-2">
        ${topTeams.map(t => {
          const isSelected = myChampion === t.id;
          const voteCount = votes[t.id]?.length || 0;
          const pct = totalMembers > 0 ? Math.round((voteCount/totalMembers)*100) : 0;
          return `
            <button class="champion-vote ${isSelected?'selected':''}"
                    onclick="setChampionPick('${t.id}')">
              <div class="text-2xl">${t.flag}</div>
              <div class="text-[11px] font-bold leading-tight truncate mt-1">${t.name}</div>
              ${voteCount > 0 ? `
                <div class="text-[9px] text-gold font-bold mt-1">${voteCount} VOTO${voteCount>1?'S':''}</div>
                <div class="vote-bar">
                  <div class="vote-bar-fill" style="width:${pct}%"></div>
                </div>
              ` : `
                <div class="text-[9px] text-muted mt-1">${state.longterm.locked&&isSelected?'🔒 SEU VOTO':' '}</div>
              `}
            </button>
          `;
        }).join('')}
      </div>
    </div>

    <!-- Painel de votos do grupo -->
    ${votedTeams.length > 0 ? `
      <div>
        <h3 class="font-display tracking-wider text-base mb-2">VOTOS DO GRUPO · ${totalVotes}/${totalMembers}</h3>
        <div class="space-y-2">
          ${votedTeams.map(v => {
            const pct = totalMembers > 0 ? Math.round((v.voters.length/totalMembers)*100) : 0;
            return `
              <div class="card p-3">
                <div class="flex items-center gap-3 mb-2">

      🎯 PALPITAR VICE / ARTILHEIRO / SURPRESA
    </button>
  `;
}

/* Voto rápido em campeão direto da tela do grupo */
function setChampionPick(teamId){
  state.longterm = state.longterm || { champion:null, vice:null, topScorer:null, surprise:null, locked:false };
  if(state.longterm.locked){
    toast('🔒 Seu palpite de longo prazo já foi travado.','warn');
    return;
  }
  state.longterm.champion = teamId;
  saveState();

  // Sincroniza com Firestore (campo championPick no /users/{uid})
  if(window.CloudSync && window.CloudSync.updateProfile){
    window.CloudSync.updateProfile({ championPick: teamId }).catch(()=>{});
  }

  const t = teamById(teamId);
  toast(`🏆 Campeão: ${t.flag} ${t.name}!`,'ok');

  // Re-renderiza
  const g = state.groups.find(x=>x.id===state.selectedGroupId);
  if(g) renderGroupDetailContent(g);
}

function myUid(){
  return (window.CloudSync && window.CloudSync.getUid && window.CloudSync.getUid()) || 'me';
}

/* Cache de usuários do Firestore (preenchido por subscribeMyGroups) */
window._userCache = window._userCache || {};

function buildGroupRanking(g){
  const me = myUid();
  const list = (g.members || []).map(uid=>{
    if(uid===me || uid==='me'){
      return { id:me, name:state.user.name, avatar:state.user.avatar, points:state.user.points, title: state.user.titles[0] };
    }
    const cached = window._userCache[uid];
    if(cached){
      return {
        id: uid,
        name: cached.displayName || cached.email?.split('@')[0] || 'Amigo',
        avatar: cached.avatar || '🙂',
        points: cached.points || 0,
        title: cached.title || ''
      };
    }
    return { id:uid, name:'Amigo', avatar:'🙂', points:0, title:'' };
  });

/* Gera um código curto, fácil de digitar, formato BR-XXXXX */
function generateGroupCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sem I/O/0/1 pra evitar confusão
  let code = 'BR-';
  for(let i=0;i<5;i++) code += chars[Math.floor(Math.random()*chars.length)];
  // Garante unicidade local
  if(state.groups.some(g=>g.code===code)) return generateGroupCode();
  return code;
}

/* Copiar código pra área de transferência */
function copyCode(code){
  if(navigator.clipboard){
    navigator.clipboard.writeText(code).then(()=>toast(`📋 Copiado: ${code}`,'ok'));
  } else {
    toast('📋 Código: '+code, 'ok');
  }
}

/* Compartilhar via Web Share API (abre WhatsApp/etc.) */
function shareCode(code, groupName){
  const text = `🏆 BOLÃO DA COPA 2026 — entra no meu grupo "${groupName}"!\n\n📲 Baixa o app BOLÃO BR e usa o código:\n\n${code}\n\nVamos ver quem manda mais no palpite! ⚽🇧🇷`;
  if(navigator.share){
    navigator.share({ title:'BOLÃO BR · Copa 2026', text }).catch(()=>{});
  } else {
    // Fallback: WhatsApp web
    const url = 'https://wa.me/?text=' + encodeURIComponent(text);
    window.open(url, '_blank');
  }
}

/* MODAL: Entrar em grupo com código */
function openJoinGroupModal(){
  openModal(`
    <div class="px-5 pt-5 pb-8">
      <div class="flex items-center justify-between mb-3">
        <div class="text-[10px] tracking-widest text-cyan">ENTRAR EM GRUPO</div>

      </div>
      <div class="font-display text-3xl leading-tight">DIGITE O <span class="text-neon">CÓDIGO</span></div>
      <div class="text-sm text-muted mt-1 mb-5">Peça o código do bolão pra quem criou o grupo (formato <span class="text-bone font-bold">BR-XXXXX</span>).</div>

      <div class="card-elev p-5 text-center">
        <input id="join-code-input" type="text" maxlength="9" placeholder="BR-XXXXX"
               class="w-full text-center font-display text-4xl tracking-[0.25em] bg-transparent border-none text-neon placeholder:text-muted/40 focus:outline-none"
               style="text-transform:uppercase" />
        <div class="text-[10px] text-muted tracking-widest mt-2">use letras e números</div>
      </div>

      <button id="join-confirm" class="btn-primary w-full py-3.5 rounded-2xl font-display tracking-widest mt-4">
        🔗 ENTRAR NO GRUPO
      </button>

      <div class="mt-5 card p-3 text-[11px] text-muted leading-snug">
        <div class="font-bold text-bone mb-1">Como funciona</div>
        Quem criou o grupo te manda o código pelo WhatsApp. Você digita aqui e cai no mesmo bolão. A partir daí, cada um palpita no próprio celular e o ranking aparece pra todos em tempo real.
      </div>
    </div>
  `);

  const input = $('#join-code-input');
  // Auto-format BR-XXXXX
  input.addEventListener('input', e=>{
    let v = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g,'');
    if(v.length===2 && !v.includes('-')) v = v+'-';
    if(v.length>3 && !v.startsWith('BR-')) v = 'BR-'+v.replace(/-/g,'').slice(0,5);
    e.target.value = v;
  });
  setTimeout(()=>input.focus(), 100);

  $('#join-confirm').addEventListener('click', async ()=>{
    const btn = $('#join-confirm');
    const code = input.value.trim().toUpperCase();
    if(!/^BR-[A-Z0-9]{4,6}$/.test(code)){
      toast('Código inválido. Formato: BR-XXXXX','err');
      return;
    }
    // Já está em algum grupo com esse código?
    const existing = state.groups.find(g=>g.code===code);
    if(existing){
      state.selectedGroupId = existing.id; saveState(); closeModal(); renderGrupos();
      toast(`Você já está em "${existing.name}".`,'warn');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="inline-block w-4 h-4 rounded-full border-2 border-black/30 border-t-black animate-spin align-middle mr-2"></span>BUSCANDO...';

    try{
      const remoteGroup = await CloudSync.findGroupByCode(code);
      if(!remoteGroup){
        toast('Grupo não encontrado. Confira o código.','err');
        btn.disabled = false;
        btn.textContent = '🔗 ENTRAR NO GRUPO';
        return;
      }
      await CloudSync.joinGroup(remoteGroup.id);
      // Optimistic add (snapshot reconcilia depois)
      if(!state.groups.find(g=>g.id===remoteGroup.id)){
        state.groups.unshift(remoteGroup);
      }
      state.selectedGroupId = remoteGroup.id;
      saveState(); closeModal(); confetti();
      toast(`🎉 Você entrou em "${remoteGroup.name}"!`,'ok');
      renderGrupos(); renderHUD();
    }catch(err){
      console.error(err);
      toast('Erro ao entrar: '+(err.message||'tente novamente'),'err');
      btn.disabled = false;
      btn.textContent = '🔗 ENTRAR NO GRUPO';
    }
  });
}

function setupPWA(){

/* ---------------- 17. KICKOFF ---------------- */
function refreshActiveScreen(){
  const active = $$('[data-screen].active')[0]?.dataset.screen || 'home';
  setTab(active);
}

/* Boot do app principal.
   Chamado por auth-ui.js após o usuário autenticar. */
window._appBoot = function appBoot(){
  if (window._appBooted) return;
  window._appBooted = true;

  setupPWA();
  renderHUD();
  setTab('home');

  // Hide splash after small delay for cinematic effect
  setTimeout(()=>{
    const sp = $('#splash');
    if(sp){ sp.classList.add('hide'); setTimeout(()=>sp.remove(), 600); }
  }, 600);

  startSimNotifs();

  // Se logado, sincroniza palpites/grupos da nuvem
  if(window.CloudSync && window.CloudSync.isOnline && window.CloudSync.isOnline()){
    syncFromCloud();
  }
};

/* Quando logado: carrega palpites e grupos do Firestore */
async function syncFromCloud(){
  try{
    // Atualiza nome/avatar do user a partir do Firebase Auth
    const fbUser = window._firebaseAuth?.currentUser;
    if(fbUser){
      state.user.name = fbUser.displayName || (fbUser.email || '').split('@')[0] || 'Torcedor';
      saveState();
    }
    const cloudPredictions = await window.CloudSync.loadMyPredictions();
    if(Object.keys(cloudPredictions).length){
      Object.assign(state.predictions, cloudPredictions);
      saveState();
    }
    // Atualiza lista de grupos em tempo real
    window.CloudSync.subscribeMyGroups(async groups => {
      state.groups = (groups || []).map(g => ({...g}));
      if(!state.selectedGroupId && state.groups[0]){
        state.selectedGroupId = state.groups[0].id;
      }
      // Se o grupo selecionado sumiu da lista, limpa seleção
      if(state.selectedGroupId && !state.groups.find(g => g.id===state.selectedGroupId)){
        state.selectedGroupId = state.groups[0]?.id || null;
      }
      saveState();

      // Calcula pontos de cada membro pra mostrar no ranking
      try{
        const allMembers = new Set();
        state.groups.forEach(g => (g.members||[]).forEach(u => allMembers.add(u)));
        const me = window.CloudSync.getUid();
        await Promise.all(Array.from(allMembers).map(async uid => {
          const pts = await window.CloudSync.computeUserPoints(uid);
          window._userCache = window._userCache || {};
          window._userCache[uid] = window._userCache[uid] || {};
          window._userCache[uid].points = pts;
          if(uid === me){
            state.user.points = pts;
            saveState();
          }
        }));
      }catch(e){ console.warn('Cálculo de pontos falhou:', e); }

      renderHUD();
      refreshActiveScreen();
    });
  }catch(e){ console.warn('Sync cloud falhou:', e); }
}

document.addEventListener('DOMContentLoaded', ()=>{
  if(!window.FIREBASE_CONFIG){
    // Boot imediato (sem auth)
    window._appBoot();
  }
  // Com Firebase: auth-ui.js dispara o boot após login.
});
